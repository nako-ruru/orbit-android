name: Android AI Auto Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "代码来源 (Branch/Tag/SHA)"
        required: true
        default: "main"
      release_tag:
        description: "本次发布的 Tag (如 v10)"
        required: true
      # 【新增】支持设置 Orbit 内核版本
      orbit_version:
        description: "Orbit 内核版本 (指定 tag 如 v0.5.41，或 latest / latest-prerelease)"
        required: true
        default: "latest"
      prerelease_flag:
        description: "标记为预发布 (Pre-release)"
        type: boolean
        default: false
      draft_flag:
        description: "是否存为草稿 (Draft)"
        type: boolean
        default: true
      notify_flag:
        description: '是否弹窗提示更新 (Notify User)?'
        required: true
        default: false
        type: boolean  # 渲染成复选框
      force_update_flag:
        description: '是否强制更新 (Force Update)?'
        required: true
        default: false
        type: boolean  # 渲染成复选框

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (The Heavy Way)
        run: |
          echo "Before cleaning:"
          df -h
          # 删除 .NET
          sudo rm -rf /usr/share/dotnet
          # 删除 Haskell (GHC)
          sudo rm -rf /opt/ghc
          # 删除一些不常用的 Android 组件 (保留 API 33)
          sudo rm -rf /usr/local/lib/android/sdk/platforms/android-28
          sudo rm -rf /usr/local/lib/android/sdk/platforms/android-29
          sudo rm -rf /usr/local/lib/android/sdk/platforms/android-30
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25.* # 删掉旧版 NDK
          echo "After cleaning:"
          df -h

      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref }}
          fetch-depth: 0
          submodules: recursive  # <--- 必须加上这一行

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly # 改为 nightly
        with:
          toolchain: nightly-2026-02-13 # 匹配日志里的版本
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c # 建议根据你的项目需求选择版本
          add-to-path: true

      # 【新增】解析 Orbit 真实的 Tag 版本号
      - name: Resolve Orbit Version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_ORBIT_VER: ${{ github.event.inputs.orbit_version }}
        run: |
          TARGET_REPO="nako-ruru/orbit-release"
          if [ "$INPUT_ORBIT_VER" = "latest" ]; then
            REAL_VER=$(gh release view --repo "$TARGET_REPO" --json tagName -q .tagName)
          elif [ "$INPUT_ORBIT_VER" = "latest-prerelease" ]; then
            REAL_VER=$(gh release list --repo "$TARGET_REPO" --json tagName,isPrerelease -q '.[] | select(.isPrerelease) | .tagName' | head -n1)
          else
            REAL_VER="$INPUT_ORBIT_VER"
          fi
          
          echo "Resolved Orbit Version: $REAL_VER"
          # 写入 GITHUB_ENV 供后续所有 Step 读取
          echo "RESOLVED_ORBIT_VERSION=$REAL_VER" >> $GITHUB_ENV

      # 执行构建脚本（把 RESOLVED_ORBIT_VERSION 传给 build-orbit.sh）
      - name: Build Components
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ORBIT_VERSION: ${{ env.RESOLVED_ORBIT_VERSION }} # 【关键修改】传递给 shell 脚本
        run: |
          chmod +x ./script/build-streamer.sh
          ./script/build-streamer.sh
          chmod +x ./script/build-rclone.sh
          ./script/build-rclone.sh
          chmod +x ./script/build-orbit.sh
          ./script/build-orbit.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Calculate Version and Strategy
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 将 CI 的 inputs 注入为环境变量供 Python 读取
          INPUT_NOTIFY: ${{ github.event.inputs.notify_flag }}       # 替换为你实际的 input key
          INPUT_FORCE: ${{ github.event.inputs.force_update_flag }}  # 替换为你实际的 input key
        run: |
          # 依然保留 git fetch 确保本地环境有 tag 缓存（虽然 gh cli 走的是 API，但留着稳妥）
          git fetch --tags
          # 直接运行 Python 脚本
          python3 ./script/calculate_meta.py
          echo "VC=${{ github.run_number }}" >> $GITHUB_ENV

      # =================【新增：在编译前注入 Android 资源文件】=================
      - name: Inject Configs to Android Assets
        env:
          ORBIT_YML: ${{ vars.ORBIT_YML }}
          ORBITD_YML: ${{ vars.ORBITD_YML }}
          FILETRANSFER_YML: ${{ vars.FILETRANSFER_YML }}
        run: |
          ASSETS_DIR="app-mirror/src/main/assets"
          
          # 确保 assets 目录存在（防止新项目或空目录未提交到 Git）
          mkdir -p "$ASSETS_DIR"
          
          # 将变量写入对应的配置文件（按照你要求的 daemon.yml 等命名）
          echo "$ORBITD_YML" > "$ASSETS_DIR/daemon.yml"
          echo "$ORBIT_YML" > "$ASSETS_DIR/orbit.yml"
          echo "$FILETRANSFER_YML" > "$ASSETS_DIR/filetransfer.yml"

      # =====================================================================


      # 【修改】在 Gradle 编译命令中注入 -PorbitVersion
      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionCode=${{ env.VC }} \
            -PversionName=${{ github.event.inputs.release_tag }} \
            -PorbitVersion=${{ env.RESOLVED_ORBIT_VERSION }} \
            --stacktrace

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app-mirror/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: Generate AI Notes
        env:
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN }}
        run: |
          # 执行你的 Python 脚本
          python ./script/ai_release_notes.py \
            --old ${{ env.LAST_TAG }} \
            --new ${{ github.event.inputs.source_ref }} \
            --repo . \
            --output ai_content.md

      # 【新增】自动生成给官网/客户端调用的 version.json 元数据文件
      - name: Generate Version JSON Metadata
        run: |
          cat <<EOF > version.json
          {
            "app_version": "${{ github.event.inputs.release_tag }}",
            "orbit_version": "${{ env.RESOLVED_ORBIT_VERSION }}",
            "version_code": ${{ env.VC }},
            "build_time": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "download_url": "https://gh-releases-mirror.guanghe.co/${{ github.repository }}/releases/download/${{ github.event.inputs.release_tag }}/orbit_android.apk"
          }
          EOF

      - name: Create Release Task
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AI_SUMMARY=$(cat ai_content.md 2>/dev/null || echo "AI 摘要生成失败，请检查脚本输出。")
          
          METADATA="<!--
          RELEASE_METADATA_START
          versionCode=${{ env.VC }}
          lastNotifyVersionCode=${{ env.LAST_NOTIFY_VC }}
          lastForceVersionCode=${{ env.LAST_FORCE_VC }}
          RELEASE_METADATA_END
          -->"
          
          FINAL_BODY="### ✨ AI 自动更新摘要\n$AI_SUMMARY\n\n$METADATA"
          
          PRERELEASE_OPT=""
          if [ "${{ github.event.inputs.prerelease_flag }}" = "true" ]; then
            PRERELEASE_OPT="--prerelease"
          fi
          
          DRAFT_OPT=""
          if [ "${{ github.event.inputs.draft_flag }}" = "true" ]; then
            DRAFT_OPT="--draft"
          fi
          
          RAW_SIGNED_APK="${{ steps.sign_app.outputs.signedReleaseFile }}"
          CLEAN_NAME="orbit_android.apk"
          mv "$RAW_SIGNED_APK" "./$CLEAN_NAME"
          
          python3 ./script/generate_assetlinks.py "./$CLEAN_NAME" "./assetlinks.json"
          
          # 【修改】在发布 Release 时，把 version.json 也一起发布上去！
          gh release create ${{ github.event.inputs.release_tag }} \
            --target ${{ github.event.inputs.source_ref }} \
            --title "Release ${{ github.event.inputs.release_tag }}" \
            --notes "$FINAL_BODY" \
            $DRAFT_OPT \
            $PRERELEASE_OPT \
            "./$CLEAN_NAME" \
            "./assetlinks.json" \
            "./version.json"